<!DOCTYPE html>
<html lang="zh-CN">
<head>
  
<script>
  const pathParts = location.pathname.split("/");
  const base = pathParts[1] === "scidataindex"
    ? "/scidataindex/"
    : "/";
  document.write(`<base href="${base}">`);
</script>
<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SciDataIndex · 任务检索</title>
  <script src="lib/d3.v7.min.js"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap");

    :root {
      --bg-0: #02061a;
      --bg-1: #061338;
      --bg-2: #0a1f4f;
      --accent: #2ee6c9;
      --glow: #6bdcff;
      --text-0: #e9f2ff;
      --text-1: #b6c7e6;
      --card: rgba(12, 27, 69, 0.7);
      --stroke: rgba(255, 255, 255, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Sora", "HarmonyOS Sans SC", "PingFang SC", sans-serif;
      color: var(--text-0);
      background: radial-gradient(900px 450px at 20% 20%, #183ea4 0%, transparent 60%),
        radial-gradient(900px 520px at 80% 20%, #0c1a45 0%, transparent 70%),
        linear-gradient(180deg, var(--bg-2) 0%, var(--bg-1) 50%, var(--bg-0) 100%);
      min-height: 100vh;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 48px;
      background: rgba(3, 9, 32, 0.7);
      backdrop-filter: blur(8px);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links {
      display: flex;
      gap: 18px;
      color: var(--text-1);
      font-size: 14px;
    }

    .nav-links a {
      color: inherit;
      text-decoration: none;
    }

    .nav-links a.active {
      color: var(--glow);
      font-weight: 600;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 20px;
      color: var(--glow);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .title-block h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 40px);
    }

    .title-block p {
      margin: 0;
      color: var(--text-1);
      font-size: 15px;
    }

    .task-search {
      margin-bottom: 28px;
      padding: 22px;
      border: 1px solid rgba(107, 220, 255, 0.3);
      border-radius: 18px;
      background: rgba(12, 27, 69, 0.82);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.24);
    }

    .task-search h2 {
      margin: 0 0 7px;
      font-size: 20px;
    }

    /* ---- 精准检索开关 ---- */
    .task-search-head {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 7px;
    }
    .task-search-head h2 {
      margin: 0;
      font-size: 20px;
    }
    .precise-toggle-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    /* 进入数据量衡按钮：参考科学问题支撑数据集 chip 样式 */
    .enter-compare-wrap {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-left: auto;
    }
    .enter-compare-btn {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 20px;
      background: rgba(140, 235, 220, 0.12);
      color: #8cebdc;
      font-size: 12.5px;
      text-decoration: none;
      border: 1px solid rgba(140, 235, 220, 0.25);
      transition: background 0.2s;
      white-space: nowrap;
    }
    .enter-compare-btn:hover { background: rgba(140, 235, 220, 0.25); }
    /* 进入数据量衡旁的问号：tooltip 右对齐避免溢出右边缘 */
    .enter-compare-help::after {
      left: auto;
      right: 0;
      transform: none;
      white-space: normal;
      width: max-content;
      max-width: 240px;
      text-align: left;
    }
    /* 检索结果条目右上角"加入数据量衡"小按钮 */
    .add-to-compare-btn {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 12px;
      border-radius: 20px;
      background: rgba(140, 235, 220, 0.10);
      color: #8cebdc;
      font-size: 11.5px;
      line-height: 1.4;
      border: 1px solid rgba(140, 235, 220, 0.25);
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .add-to-compare-btn:hover { background: rgba(140, 235, 220, 0.25); }
    .add-to-compare-btn.added { opacity: 0.55; cursor: default; }
    /* 检索候选区上限弹窗 */
    .compare-cap-modal-mask {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(2, 6, 18, 0.6);
      display: flex; align-items: center; justify-content: center;
    }
    .compare-cap-modal {
      position: relative;
      background: rgba(10, 18, 50, 0.98);
      border: 1px solid rgba(107, 220, 255, 0.3);
      border-radius: 14px;
      padding: 26px 30px 22px;
      max-width: 380px;
      color: var(--text-0);
      font-size: 14px;
      line-height: 1.7;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
    }
    .compare-cap-modal .cap-close {
      position: absolute; top: 10px; right: 12px;
      background: transparent; border: none; color: var(--text-1);
      font-size: 18px; cursor: pointer; line-height: 1; padding: 0; opacity: 0.6;
    }
    .compare-cap-modal .cap-close:hover { opacity: 1; color: #ff6b8a; }
    .compare-cap-modal .cap-ok {
      margin-top: 18px;
      padding: 7px 22px;
      border-radius: 999px;
      border: 1px solid rgba(140, 235, 220, 0.3);
      background: rgba(140, 235, 220, 0.15);
      color: #8cebdc;
      font-size: 13px; cursor: pointer; font-family: inherit;
    }
    .compare-cap-modal .cap-ok:hover { background: rgba(140, 235, 220, 0.28); }
    .precise-switch {
      position: relative;
      width: 46px;
      height: 24px;
      border-radius: 999px;
      border: 1px solid rgba(107, 220, 255, 0.4);
      background: transparent;
      cursor: pointer;
      transition: background 0.25s ease, border-color 0.25s ease;
      padding: 0;
      flex: none;
    }
    .precise-switch .knob {
      position: absolute;
      top: 50%;
      left: 3px;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #9fb4db;
      transition: left 0.25s ease, background 0.25s ease;
    }
    .precise-switch.on {
      background: linear-gradient(135deg, var(--glow), var(--accent));
      border-color: var(--accent);
    }
    .precise-switch.on .knob {
      left: calc(100% - 21px);
      background: #ffffff;
    }
    .precise-label {
      font-size: 12.5px;
      color: var(--text-1);
      user-select: none;
    }
    .precise-help {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(159, 180, 219, 0.6);
      color: #9fb4db;
      font-size: 11px;
      cursor: help;
      user-select: none;
    }
    .precise-help::after {
      content: attr(data-tip);
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      background: rgba(6, 19, 56, 0.97);
      border: 1px solid rgba(107, 220, 255, 0.4);
      color: var(--text-1);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 50;
    }
    .precise-help:hover::after {
      opacity: 1;
    }
    /* 关闭精准检索时，非结果标签页置灰提示 */
    .task-tab-panel .panel-locked {
      padding: 30px 16px;
      text-align: center;
      color: #9fb4db;
      font-size: 13px;
    }

    .task-search > p {
      margin: 0 0 16px;
      color: var(--text-1);
      font-size: 13px;
      line-height: 1.7;
    }

    .task-search-form {
      display: flex;
      gap: 10px;
    }

    .task-search-form input {
      min-width: 0;
      flex: 1;
      padding: 12px 15px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      outline: none;
      background: rgba(255, 255, 255, 0.09);
      color: var(--text-0);
      font-size: 14px;
    }

    .task-search-form input:focus {
      border-color: var(--glow);
      box-shadow: 0 0 0 3px rgba(107, 220, 255, 0.12);
    }

    .task-search-form button {
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--glow), var(--accent));
      color: #061338;
      font-weight: 700;
      cursor: pointer;
    }

    .task-search-form button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .task-status {
      min-height: 20px;
      margin: 10px 0 0;
      color: #9fb4db;
      font-size: 12px;
    }

    .task-status.error {
      color: #ffb4b4;
    }

    .task-progress {
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 6px;
    }

    .task-progress li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: var(--text-1);
      font-size: 12.5px;
      line-height: 1.5;
      opacity: 0;
      animation: progressIn 0.3s ease forwards;
    }

    @keyframes progressIn {
      to { opacity: 1; }
    }

    .task-progress li .dot {
      flex: none;
      width: 7px;
      height: 7px;
      margin-top: 5px;
      border-radius: 50%;
      background: var(--accent);
    }

    .task-progress li.active .dot {
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    .task-progress li.done {
      color: #9fb4db;
    }

    .task-progress li.done .dot {
      background: #5ec98a;
      animation: none;
    }

    /* ---- 进度栏折叠 ---- */
    .task-progress-toggle {
      display: none; /* 检索完成后才显示 */
      align-items: center;
      gap: 6px;
      margin: 10px 0 0;
      padding: 0;
      border: none;
      background: transparent;
      color: #9fb4db;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }

    .task-progress-toggle.show {
      display: flex;
    }

    .task-progress-toggle .caret {
      display: inline-block;
      transition: transform 0.2s;
      font-size: 10px;
    }

    .task-progress-toggle.expanded .caret {
      transform: rotate(90deg);
    }

    .task-progress-toggle:hover {
      color: var(--text-0);
    }

    .task-progress.collapsed {
      display: none;
    }

    .task-results {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    /* ---- 检索结果标签页 ---- */
    .task-tabs {
      display: none; /* 检索完成后才显示 */
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 0;
    }

    .task-tabs.show {
      display: flex;
    }

    .task-tab {
      padding: 8px 14px;
      border: none;
      background: transparent;
      color: var(--text-1);
      font-size: 13px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }

    .task-tab:hover {
      color: var(--text-0);
    }

    .task-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    .task-tab-panels {
      margin-top: 12px;
    }

    .task-tab-panel {
      display: none;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .task-tab-panel.active {
      display: block;
    }

    /* 面板滚动条样式 */
    .task-tab-panel::-webkit-scrollbar {
      width: 8px;
    }

    .task-tab-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 4px;
    }

    .task-tab-panel .panel-text {
      color: var(--text-1);
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    /* 研究意义、数据关联：按语义句段换行，每段首行缩进以提升长文本可读性。 */
    .task-tab-panel .panel-text.panel-readable {
      white-space: normal;
    }

    .task-tab-panel .panel-readable p {
      margin: 0 0 0.7em;
      text-indent: 2em;
    }

    .task-tab-panel .panel-readable p:last-child {
      margin-bottom: 0;
    }

    .task-tab-panel .panel-readable p.is-list-item {
      padding-left: 1.2em;
      text-indent: -1.2em;
    }

    .task-tab-panel .panel-list {
      margin: 0;
      padding-left: 20px;
      color: var(--text-1);
      font-size: 13px;
      line-height: 1.7;
    }

    .task-tab-panel .panel-list li {
      margin-bottom: 8px;
    }

    .task-tab-panel .panel-subtitle {
      color: var(--text-0);
      font-size: 13px;
      font-weight: 600;
      margin: 12px 0 6px;
    }

    .task-tab-panel .panel-loading {
      color: #9fb4db;
      font-size: 13px;
      padding: 20px 0;
      text-align: center;
    }

    /* 科学问题：数据集标签 */
    .panel-question {
      margin-bottom: 14px;
    }

    .panel-question .q-text {
      color: var(--text-1);
      font-size: 13px;
      line-height: 1.6;
    }

    .panel-question .q-datasets {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .panel-question .q-ds-label {
      color: #9fb4db;
      font-size: 11.5px;
    }

    .panel-question .q-ds-link {
      display: inline-block;
      max-width: 320px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      vertical-align: middle;
      padding: 2px 9px;
      border-radius: 20px;
      background: rgba(140, 235, 220, 0.12);
      color: #8cebdc;
      font-size: 11.5px;
      text-decoration: none;
      border: 1px solid rgba(140, 235, 220, 0.25);
      transition: background 0.2s;
    }

    .panel-question .q-ds-link:hover {
      background: rgba(140, 235, 220, 0.25);
    }

    .task-result {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto auto;
      gap: 12px;
      align-items: center;
      padding: 13px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.07);
    }

    .task-result-rank {
      color: var(--accent);
      font-size: 18px;
      font-weight: 700;
    }

    /* top-6 ~ top-10 标号：暗灰色（与图谱非 top5 数据集节点灰 #5a6f96 一致） */
    .task-result-rank.dim {
      color: #5a6f96;
    }

    .task-result-name {
      color: var(--text-0);
      font-weight: 600;
      text-decoration: none;
    }

    .task-result-description {
      margin-top: 5px;
      color: var(--text-1);
      font-size: 12px;
      line-height: 1.55;
    }

    .task-result-score {
      color: #8cebdc;
      font-size: 12px;
      white-space: nowrap;
    }

    /* ---- 数据集知识图谱 ---- */
    .task-tab-panel[data-panel="graph"] {
      max-height: none; /* 图谱面板不限制滚动高度，用固定高度容器 */
      overflow: visible;
      padding-right: 0;
    }

    .graph-wrap {
      position: relative;
      width: 100%;
      height: 480px;
      border-radius: 12px;
      background: rgba(3, 9, 32, 0.5);
      border: 1px solid rgba(107, 220, 255, 0.15);
      overflow: hidden;
    }

    .graph-wrap svg {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    .graph-wrap svg:active {
      cursor: grabbing;
    }

    .graph-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #9fb4db;
      font-size: 13px;
    }

    .graph-back-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 5;
      padding: 4px 12px;
      border-radius: 16px;
      border: 1px solid rgba(107, 220, 255, 0.35);
      background: rgba(12, 27, 69, 0.85);
      color: var(--glow);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .graph-back-btn:hover {
      background: rgba(107, 220, 255, 0.18);
    }

    /* 左上角按钮组容器：多个按钮并排 */
    .graph-btn-group {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 5;
      display: flex;
      gap: 8px;
    }

    /* 按钮组内的按钮取消单独绝对定位（由容器定位） */
    .graph-btn-group .graph-back-btn {
      position: static;
    }

    /* 按钮禁用态（推理动画播放中 / 无推理数据） */
    .graph-back-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .graph-back-btn:disabled:hover {
      background: rgba(12, 27, 69, 0.85);
    }

    .graph-legend {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 5;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(3, 9, 32, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      width: min(270px, calc(100% - 24px));
      font-size: 11px;
      color: var(--text-1);
      line-height: 1.8;
      pointer-events: none;
    }

    /* 数据集子视图的图例默认收起，展开时位于右下角开关上方。 */
    .graph-legend.is-toggleable {
      bottom: 42px;
    }

    .graph-legend-toggle {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 6;
      padding: 4px 10px;
      border: 1px solid rgba(107, 220, 255, 0.35);
      border-radius: 16px;
      background: rgba(12, 27, 69, 0.88);
      color: var(--glow);
      font-size: 11px;
      cursor: pointer;
    }

    .graph-legend-toggle:hover {
      background: rgba(107, 220, 255, 0.18);
    }

    /* 关系视图右上角：双路召回到 LLM 重排的 Top-5 回放榜单 */
    .graph-ranking-replay {
      position: absolute;
      top: 42px;
      right: 10px;
      z-index: 5;
      width: min(270px, calc(100% - 24px));
      padding: 10px;
      border: 1px solid rgba(107, 220, 255, 0.28);
      border-radius: 10px;
      background: rgba(3, 9, 32, 0.84);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      font-size: 11px;
      pointer-events: none;
    }

    .graph-ranking-toggle {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 6;
      padding: 4px 10px;
      border: 1px solid rgba(107, 220, 255, 0.35);
      border-radius: 16px;
      background: rgba(12, 27, 69, 0.88);
      color: var(--glow);
      font-size: 11px;
      cursor: pointer;
    }

    .graph-ranking-toggle:hover {
      background: rgba(107, 220, 255, 0.18);
    }

    .graph-ranking-replay-title {
      margin-bottom: 7px;
      color: #bfeaff;
      font-size: inherit;
      font-weight: 600;
      transition: opacity 160ms ease;
    }

    .graph-ranking-replay-list {
      display: grid;
      gap: 4px;
      transition: opacity 160ms ease;
    }

    .graph-ranking-replay-item {
      min-height: 25px;
      padding: 3px 6px;
      overflow: hidden;
      border-radius: 6px;
      color: var(--text-0);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
      will-change: transform, opacity;
    }

    .graph-ranking-replay-item.entering {
      opacity: 0;
    }

    .graph-ranking-replay-title.is-fading,
    .graph-ranking-replay-list.is-fading {
      opacity: 0;
    }

    .graph-legend .lg-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: -1px;
    }

    .graph-legend .lg-line {
      display: inline-block;
      width: 16px;
      height: 0;
      border-top: 2px solid rgba(107, 220, 255, 0.5);
      margin-right: 6px;
      vertical-align: 3px;
    }

    .graph-tooltip {
      position: absolute;
      z-index: 10;
      display: none;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(3, 9, 32, 0.92);
      border: 1px solid rgba(107, 220, 255, 0.3);
      color: var(--text-0);
      font-size: 12px;
      line-height: 1.5;
      pointer-events: none;
      max-width: 260px;
      white-space: pre-line;
    }

    .graph-node-label {
      fill: var(--text-1);
      font-size: 10px;
      pointer-events: none;
      text-anchor: middle;
    }

    @media (max-width: 980px) {
      .task-search-form {
        flex-direction: column;
      }

      .task-search-form button {
        min-height: 42px;
      }

      .task-result {
        grid-template-columns: 30px minmax(0, 1fr);
      }

      .task-result-score {
        grid-column: 2;
      }

      .add-to-compare-btn {
        grid-column: 2;
        justify-self: start;
      }
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-left">
      <div class="brand"><span style="position:relative;display:inline-block;">SciDataIndex<img src="images/opencompass.svg" alt="OpenCompass" style="position:absolute;top:-8px;right:0;height:11px;width:auto;opacity:0.85;"></span></div>
      <nav class="nav-links">
        <a href="index.html">首页</a>
        <a href="data_ranks/earth_science.html">数据榜单</a>
        <a href="dataset_list.html">数据列表</a>
        <a href="task_search.html" class="active">任务检索</a>
        <a href="compare.html">数据量衡</a>
        <a href="evaluation.html">技术说明</a>
        <a href="about.html">关于我们</a>
      </nav>
