  <script>
    function toFileName(name) {
      return `${name.replace(/ /g, "_").replace(/\s+/g, "_").replace(/[\\/]/g, "_")}_ratings1.json`;
    }

    function getParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    const datasetName = getParam("name") || "3D Turbulence DNS dataset";
    const fileParam = getParam("file");
    const categoryParam = getParam("category");
    const aliasMapPath = "dataset_alias_map.json";
    const scoreRoot = "score_json";

    const detailList = document.getElementById("detailList");
    const titleEl = document.getElementById("datasetTitle");
    const briefEl = document.getElementById("datasetBrief");
    const tagCategory = document.getElementById("tagCategory");
    const tagStatus = document.getElementById("tagStatus");
    const tabBar = document.getElementById("tabBar");

    function normalizeDetailValue(content) {
      if (content === null || content === undefined || content === "") return "待填写";
      if (typeof content === "number" && Number.isNaN(content)) return "-";
      if (typeof content === "string" && content.trim().toLowerCase() === "nan") return "-";
      return content;
    }

    function isHttpUrl(v) {
      return typeof v === "string" && /^https?:\/\//i.test(v.trim());
    }

    function addDetail(title, content, link) {
      const safeContent = normalizeDetailValue(content);
      const item = document.createElement("div");
      item.className = "detail-item";
      // 有超链接时只渲染链接本身，避免与内容文本重复显示同一 URL
      const bodyHtml = link
        ? `<span><a class="ext-link" data-url="${link}" rel="noreferrer">${link}</a></span>`
        : `<span>${safeContent}</span>`;
      item.innerHTML = `
        <strong>${title}</strong>
        ${bodyHtml}
      `;
      detailList.appendChild(item);
    }

    function getScore(data, key) {
      console.log(key, data[key]);
      // console.log("type:", typeof rating.openness, "value:", rating.openness);
      // if (typeof rating[key] === "number") return rating[key];
      // return null;
      return typeof data[key] === "number" ? data[key] : null;
    }

    function drawRadar(scores) {
      const canvas = document.getElementById("radarCanvas");
      const ctx = canvas.getContext("2d");
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const cssWidth = canvas.getAttribute("width") ? Number(canvas.getAttribute("width")) : canvas.width;
      const cssHeight = canvas.getAttribute("height") ? Number(canvas.getAttribute("height")) : canvas.height;
      canvas.style.width = `${cssWidth}px`;
      canvas.style.height = `${cssHeight}px`;
      canvas.width = Math.round(cssWidth * dpr);
      canvas.height = Math.round(cssHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const labels = ["开放性", "规模", "影响力", "安全性", "AI就绪度", "数据质量"];
      const maxValue = 10;
      const centerX = cssWidth / 2;
      const centerY = cssHeight / 2 + 10;
      const radius = 140;
      const levels = 5;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(255,255,255,0.2)";
      ctx.lineWidth = 1;
      for (let l = 1; l <= levels; l++) {
        ctx.beginPath();
        const r = (radius / levels) * l;
        for (let i = 0; i < labels.length; i++) {
          const angle = (Math.PI * 2 / labels.length) * i - Math.PI / 2;
          const x = centerX + r * Math.cos(angle);
          const y = centerY + r * Math.sin(angle);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      }

      ctx.fillStyle = "#b6c7e6";
      ctx.font = "13px Sora, sans-serif";
      labels.forEach((label, i) => {
        const angle = (Math.PI * 2 / labels.length) * i - Math.PI / 2;
        const x = centerX + (radius + 18) * Math.cos(angle);
        const y = centerY + (radius + 18) * Math.sin(angle);
        ctx.fillText(label, x - 16, y + 4);
      });

      ctx.beginPath();
      scores.forEach((score, i) => {
        const ratio = Math.max(0, Math.min(maxValue, score)) / maxValue;
        const angle = (Math.PI * 2 / labels.length) * i - Math.PI / 2;
        const x = centerX + radius * ratio * Math.cos(angle);
        const y = centerY + radius * ratio * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fillStyle = "rgba(46, 230, 201, 0.35)";
      ctx.fill();
      ctx.strokeStyle = "#2ee6c9";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function renderTab(name, label, data) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tab-btn";
      btn.textContent = label;
      btn.dataset.tab = name;
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
        btn.classList.add("active");
        detailList.innerHTML = "";
        data();
      });
      tabBar.appendChild(btn);
      return btn;
    }

    function buildTabs(data) {
      tabBar.innerHTML = "";
      detailList.innerHTML = "";

      const aiTab = renderTab("ai", "AI 就绪度", () => {
        addDetail("标注密度", data?.AI_readiness?.annotation_density);
        addDetail("预处理程度", data?.AI_readiness?.preprocessing_level);
        addDetail("格式一致性", data?.AI_readiness?.format_consistency);
      });

      renderTab("openness", "开放性", () => {
        addDetail("许可证类型", data?.openness?.license_type);
        addDetail("许可证来源链接", data?.openness?.license_source_link);
        addDetail("收费模式", data?.openness?.charging_mode);
        addDetail("访问限制", data?.openness?.access_restrictions);
        addDetail("申请难度", data?.openness?.application_difficulty);
      });

      renderTab("scale", "数据集规模", () => {
        addDetail("数据体量", data?.data_scale?.data_volume);
        addDetail("数据体量来源", data?.data_scale?.source_of_data_volume);
      });

      renderTab("impact", "影响力", () => {
        addDetail("引用与论文", data?.impact?.paper_link);
          const relatedPapers = data?.impact?.google_scholar_related_papers;
          const relatedPapersDisplay = Number.isFinite(Number(relatedPapers))
            ? String(parseInt(relatedPapers, 10))
            : relatedPapers;
          addDetail("相关论文数", relatedPapersDisplay);
      });

      renderTab("safety", "安全性", () => {
        addDetail("管控级别", data?.safety?.control_level);
        addDetail("可追溯性", data?.safety?.traceability);
      });

      renderTab("quality", "数据质量", () => {
        addDetail("完整性", data?.data_quality?.integrity);
        addDetail("首次发布", data?.data_quality?.first_release_date);
        addDetail("最近更新", data?.data_quality?.last_update_date);
        const srcLink = data?.data_quality?.source_link;
        const dlLink = data?.data_quality?.download_link;
        addDetail("来源链接", srcLink, isHttpUrl(srcLink) ? srcLink : null);
        addDetail("下载链接", dlLink, isHttpUrl(dlLink) ? dlLink : null);
      });

      aiTab.classList.add("active");
      aiTab.click();
    }

    async function resolveDatasetName() {
      try {
        const res = await fetch(aliasMapPath);
        if (!res.ok) return datasetName;
        const map = await res.json();
        if (map && map[datasetName]) return map[datasetName];
        const keyLower = datasetName.toLowerCase();
        for (const [alias, mapped] of Object.entries(map || {})) {
          if (alias.toLowerCase() === keyLower) return mapped;
        }
        return datasetName;
      } catch {
        return datasetName;
      }
    }

    async function loadScores(mappedName, fallbackName, categoryFromPath) {
      const mappedFile = toFileName(mappedName).replace("_ratings1.json", "_scores.json");
      const fallbackFile = toFileName(fallbackName).replace("_ratings1.json", "_scores.json");
      //const candidates = [];
      let path = null;

      if (categoryFromPath) {
        path = `${scoreRoot}/${categoryFromPath}/${mappedFile}`;
        //candidates.push(`${scoreRoot}/${categoryFromPath}/${mappedFile}`);
      //  if (fallbackFile !== mappedFile) {
      //    candidates.push(`${scoreRoot}/${categoryFromPath}/${fallbackFile}`);
      //  }
      }

      // candidates.push(`${scoreRoot}/${mappedFile}`);
      // if (fallbackFile !== mappedFile) {
      //   candidates.push(`${scoreRoot}/${fallbackFile}`);
      // }

      //["earth_science", "neuro_science", "life_science"].forEach(folder => {
      //  candidates.push(`${scoreRoot}/${folder}/${mappedFile}`);
      //  if (fallbackFile !== mappedFile) {
      //    candidates.push(`${scoreRoot}/${folder}/${fallbackFile}`);
      //  }
      //});

      //for (const path of candidates) {
      console.log(`尝试加载评分数据文件: ${path}`);
      const res = await fetch(path);
      if (res.ok) {
        const data = await res.json();
        if (data && data.scores) {
          return data.scores;
        }
      }
      //}
      return null;
    }

    async function loadDataset() {
      try {
        const mappedName = await resolveDatasetName();
        const mappedFile = toFileName(mappedName);
        const fallbackFile = toFileName(datasetName);
        // 候选文件名：优先用 URL 传入的精确 file（后端 mapping 的 web_file，与磁盘一致），
        // 再回退到用映射名/原始名现拼（长名/含特殊字符时会与磁盘文件名不符）。去重保序。
        const fileCandidates = [];
        [fileParam, mappedFile, fallbackFile].forEach(f => {
          if (f && !fileCandidates.includes(f)) fileCandidates.push(f);
        });
        const candidates = [];
        if (categoryParam) {
          fileCandidates.forEach(f => candidates.push(`data_json/${categoryParam}/${f}`));
        }
        console.log(`候选数据集路径:`, candidates);

        let data = null;
        let loadedPath = null;
        for (const path of candidates) {
          console.log(`尝试加载数据集文件: ${path}`);
          const res = await fetch(path);
          if (res.ok) {
            data = await res.json();
            loadedPath = path;
            break;
          }
        }
        if (!data) throw new Error("not found");

        titleEl.textContent = data.dataset || datasetName;
        briefEl.textContent = data.intro?.brief_description || "暂无简介";
        let categoryFromPath = "";
        if (loadedPath) {
          if (loadedPath.includes("/earth_science/")) {
            tagCategory.textContent = "地球科学";
            categoryFromPath = "earth_science";
          } else if (loadedPath.includes("/neuro_science/")) {
            tagCategory.textContent = "神经科学";
            categoryFromPath = "neuro_science";
          } else if (loadedPath.includes("/life_science/")) {
            tagCategory.textContent = "生命科学";
            categoryFromPath = "life_science";
          } else if (loadedPath.includes("/physical_science/")) {
            tagCategory.textContent = "物质科学";
            categoryFromPath = "physical_science";
          } else if (loadedPath.includes("/material_science/")) {
            tagCategory.textContent = "材料科学";
            categoryFromPath = "material_science";
          } else if (loadedPath.includes("/chemistry_science/")) {
            tagCategory.textContent = "化学科学";
            categoryFromPath = "chemistry_science";
          } else if (loadedPath.includes("/astronomy_science/")) {
            tagCategory.textContent = "天文科学";
            categoryFromPath = "astronomy_science";
          } else if (loadedPath.includes("/general_science/")) {
            tagCategory.textContent = "通识科学";
            categoryFromPath = "general_science";
          } else if (loadedPath.includes("/computer_science/")) {
            tagCategory.textContent = "计算机科学";
            categoryFromPath = "computer_science";
          }
           else {
            tagCategory.textContent = "所属类别未知";
          }
        } else {
          tagCategory.textContent = "所属类别未知";
        }

        buildTabs(data);

        const scoreData = await loadScores(mappedName, datasetName, categoryFromPath);
        console.log("加载的评分数据对象:", scoreData);
        if (scoreData) {
          tagStatus.textContent = "已验证";
          tagStatus.classList.remove("status-pending");
          tagStatus.classList.add("status-verified");
        } else {
          tagStatus.textContent = "挖掘中...";
          tagStatus.classList.remove("status-verified");
          tagStatus.classList.add("status-pending");
        }
        tagStatus.style.display = "inline-flex";
        const scoreSource = scoreData || data;
        const scores = [
          getScore(scoreSource, "openness"),
          getScore(scoreSource, "scale"),
          getScore(scoreSource, "impact"),
          getScore(scoreSource, "safety"),
          getScore(scoreSource, "ai_readiness"),
          getScore(scoreSource, "quality")
        ];
        // console.log("加载的评分数据:", scores);
        const safeScores = scores.map(score => (Number.isFinite(score) ? score : 0));
        drawRadar(safeScores);
      } catch (err) {
        titleEl.textContent = "数据集文件未找到";
        briefEl.textContent = "请确认 data_json 目录下存在对应的数据集 JSON 文件。";
        buildTabs(null);
        detailList.innerHTML = "";
        addDetail("加载错误", "无法加载匹配的数据集文件，请检查映射表与文件路径。");
        drawRadar([0, 0, 0, 0, 0, 0]);
      }
    }
    
    loadDataset();

    // 外链跳转确认弹窗
    const jumpMask = document.getElementById("jumpModalMask");
    const jumpUrlEl = document.getElementById("jumpModalUrl");
    let pendingUrl = null;

    document.addEventListener("click", (e) => {
      const a = e.target.closest("a.ext-link");
      if (!a) return;
      e.preventDefault();
      pendingUrl = a.dataset.url;
      jumpUrlEl.textContent = pendingUrl;
      jumpMask.classList.add("show");
    });

    document.getElementById("jumpCancel").addEventListener("click", () => {
      pendingUrl = null;
      jumpMask.classList.remove("show");
    });

    document.getElementById("jumpConfirm").addEventListener("click", () => {
      if (pendingUrl) window.open(pendingUrl, "_blank", "noopener,noreferrer");
      pendingUrl = null;
      jumpMask.classList.remove("show");
    });

    jumpMask.addEventListener("click", (e) => {
      if (e.target === jumpMask) {
        pendingUrl = null;
        jumpMask.classList.remove("show");
      }
    });
  </script>
</body>
</html>
